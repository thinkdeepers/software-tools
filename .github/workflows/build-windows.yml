name: 打包 Windows exe

# 手动触发、推送到主分支、或打 tag 时构建 Windows 可执行文件。
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyInstaller 及可选依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller py7zr rarfile

      - name: 打包 exe
        run: python build_windows.py

      - name: 运行核心测试
        run: |
          pip install pytest
          python -m pytest -q

      - name: 上传 exe 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 简压-windows-exe
          path: dist/*.exe
          if-no-files-found: error

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
