name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - eye-care
    paths:
      - 'eye-care/**'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r eye-care/requirements.txt pyinstaller pillow

      - name: Generate app icon
        run: python eye-care/scripts/generate_icon.py

      - name: Build EXE
        working-directory: eye-care
        run: pyinstaller --noconfirm --clean eye-care.spec

      - name: Copy to windows-install folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path eye-care/windows-install | Out-Null
          Copy-Item -Force eye-care/dist/护眼卫士.exe eye-care/windows-install/护眼卫士.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 护眼卫士-Windows
          path: eye-care/dist/护眼卫士.exe
          retention-days: 30

      - name: Create Release asset (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: eye-care/dist/护眼卫士.exe
