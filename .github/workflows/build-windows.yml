name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/eye-care-app-6f9e
    paths:
      - 'eye-care/**'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r eye-care/requirements.txt pyinstaller

      - name: Build EXE
        working-directory: eye-care
        run: pyinstaller --noconfirm --clean eye-care.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 护眼卫士-Windows
          path: eye-care/dist/护眼卫士.exe
          retention-days: 30

      - name: Create Release asset (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: eye-care/dist/护眼卫士.exe
