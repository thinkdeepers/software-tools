name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - eye-care
    paths:
      - 'src/**'
      - 'assets/**'
      - 'eye-care.spec'
      - 'requirements.txt'
      - 'scripts/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller pillow

      - name: Verify app icon
        shell: pwsh
        run: |
          if (-not (Test-Path assets/icon.ico)) { throw "icon.ico missing" }
          $bytes = [IO.File]::ReadAllBytes("assets/icon.ico")
          $count = [BitConverter]::ToUInt16($bytes, 4)
          if ($count -lt 7) { throw "icon.ico must contain at least 7 sizes, got $count" }
          $offset = [BitConverter]::ToUInt32($bytes, 18)
          $biSize = [BitConverter]::ToUInt32($bytes, [int]$offset)
          if ($biSize -ne 40) { throw "icon.ico must use BMP/DIB frames, biSize=$biSize" }
          Write-Host "icon.ico OK ($count BMP sizes)"
          if (-not (Test-Path assets/checkbox_on.png)) { throw "checkbox icons missing" }

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean eye-care.spec
          if (-not (Test-Path dist/eyecare.exe)) { throw "eyecare.exe not built" }
          $size = (Get-Item dist/eyecare.exe).Length
          Write-Host "Built EXE size: $size"

      - name: Copy to release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Get-ChildItem release -Force | Remove-Item -Recurse -Force
          Copy-Item -Force dist/eyecare.exe "release/护眼卫士.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eyecare-Windows
          path: release/护眼卫士.exe
          retention-days: 30

      - name: Create Release asset (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/护眼卫士.exe
